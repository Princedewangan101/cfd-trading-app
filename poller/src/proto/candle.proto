syntax = "proto3";

package candles;

service CandleService {
    rpc GetCandles (CandleRequest) returns (CandleResponse);
}


message CandleRequest {
    string symbol = 1;
    string timeFrame = 2;
    int64 from = 3;
    int32 take = 4;
}

message CandleResponse {
    repeated Candle candles = 1;
}

message Candle {
   string candleStickId = 1;
   string symbol = 2;
   string timeFrame = 3;
   int64 time = 4;
   double open = 6;
   double close = 7;
   double high = 8;
   double low = 9;
   double volume = 10;
}

